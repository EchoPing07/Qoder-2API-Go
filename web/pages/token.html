      <section x-cloak class="space">
        <header class="page-head">
          <h1>账号</h1>
          <div class="page-actions">
            <a class="btn btn-secondary btn-sm" href="https://qoder.cn/account/integrations" target="_blank" rel="noreferrer">
              <span class="ic" x-html="ic('external')"></span>创建令牌
            </a>
            <button class="btn btn-sm" @click="accountModal=true"><span class="ic" x-html="ic('plus')"></span>添加账号</button>
          </div>
        </header>

        <div class="card">
          <div class="card-head">
            <h3>账号池</h3>
            <!-- 账号等级徽标（Free / Teams…）：自「统计」页迁入，数据源仍是 stats 快照 -->
            <span class="badge badge-muted" x-show="accountTag" x-text="accountTag"></span>
            <div class="spacer"></div>
            <span class="muted-xs">API 桥接使用激活中的账号；切换后桥接会话在下次请求时自动重建</span>
          </div>
          <div class="table-wrap" x-show="accounts.length">
            <table>
              <thead><tr><th>令牌</th><th>区域</th><th>备注</th><th>剩余额度</th><th>状态</th><th>检测时间</th><th></th></tr></thead>
              <tbody>
                <template x-for="acc in accounts" :key="acc.id">
                  <tr>
                    <td>
                      <div class="row" style="gap:6px;flex-wrap:nowrap">
                        <code class="key-chip" :title="acc.pat_masked" x-text="acc.pat_masked"></code>
                        <span class="badge badge-ok" x-show="acc.active">使用中</span>
                      </div>
                    </td>
                    <td><span class="badge badge-muted" x-text="accountRegion(acc)"></span></td>
                    <td x-text="acc.note || '—'"></td>
                    <td x-text="accountQuota(acc)"></td>
                    <td><span class="badge" :class="accountStatusClass(acc)" x-text="accountStatus(acc)"></span></td>
                    <td class="muted-xs" x-text="acc.snapshot && acc.snapshot.checked_at ? ts(acc.snapshot.checked_at) : '—'"></td>
                    <td>
                      <div class="row" style="gap:2px;flex-wrap:nowrap;justify-content:flex-end">
                        <button class="btn btn-ghost btn-sm" x-show="!acc.active" @click="switchAccount(acc)">切换</button>
                        <button class="btn btn-ghost btn-sm" @click="checkAccount(acc)" :disabled="checkingId===acc.id">
                          <span class="spin" x-show="checkingId===acc.id"></span>
                          <span x-show="checkingId!==acc.id">检测</span>
                        </button>
                        <button class="btn btn-ghost btn-sm" @click="editAccountNote(acc)">备注</button>
                        <button class="btn btn-ghost btn-sm" style="color:var(--destructive)" @click="deleteAccount(acc)">删除</button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="empty" x-show="!accounts.length">
            <span class="ic ic-lg" x-html="ic('token')"></span>
            暂无账号，点击右上角添加第一个账号
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3>自动切换</h3>
            <div class="spacer"></div>
            <span class="muted-xs">激活账号额度低于阈值时自动切到余额充足的账号</span>
          </div>
          <div class="switch-row">
            <span class="sw-label">启用自动切换</span>
            <button type="button" class="switch" :class="autoSwitch.enabled ? 'on' : ''" @click="autoSwitch.enabled = !autoSwitch.enabled" aria-label="启用自动切换"></button>
          </div>
          <div class="form-row">
            <label class="label">阈值（剩余积分，低于此值自动切换）</label>
            <input class="input" type="number" min="1" step="1" x-model.number="autoSwitch.threshold">
            <p class="field-hint">当前账号剩余积分 ≤ 阈值时切到余额最多的账号（预留 5 积分滞回防振荡）；所有账号都低于阈值时留守当前账号并继续服务。硬耗尽的账号冷却到下次重置点。</p>
          </div>
          <div class="action-row">
            <div class="spacer"></div>
            <button class="btn btn-sm" @click="saveAutoSwitch()" :disabled="loading">
              <span class="spin" x-show="loading"></span>
              <span x-show="!loading">保存</span>
            </button>
          </div>
        </div>
      </section>

<!-- ═══ 添加账号弹窗 ═══ -->
<template x-if="accountModal">
  <form class="overlay" @click.self="accountModal=false">
    <div class="modal">
      <form @submit.prevent="createAccount()">
        <div class="modal-title">添加账号</div>
        <p class="modal-msg">填入 Qoder 个人访问令牌（PAT）。令牌相同时视为切换到已有账号。</p>
        <div class="form-row"><label class="label">令牌</label><input class="input mono" x-model="accountForm.pat" placeholder="pt-..." autocomplete="off"></div>
        <div class="form-row">
          <label class="label">区域</label>
          <select class="input" x-model="accountForm.region">
            <option value="cn">国内版（qoder.com.cn）</option>
            <option value="global">国际版（qoder.sh）</option>
          </select>
          <p class="field-hint">令牌所属区域必须匹配，否则会提示「personal token is invalid」。</p>
        </div>
        <div class="form-row"><label class="label">备注</label><input class="input" x-model="accountForm.note" placeholder="可选描述" autocomplete="off"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-secondary btn-sm" @click="accountModal=false">取消</button>
          <button type="submit" class="btn btn-sm" :disabled="loading">
            <span class="spin" x-show="loading"></span>
            <span x-show="!loading">添加</span>
          </button>
        </div>
      </form>
    </div>
  </form>
</template>

<!-- ═══ 备注弹窗 ═══ -->
<template x-if="noteModal">
  <div class="overlay" @click.self="noteModal=false">
    <form class="modal" @submit.prevent="saveAccountNote()">
      <div class="modal-title">修改备注</div>
      <div class="form-row"><label class="label">备注</label><input class="input" x-model="noteForm.note" placeholder="可选描述" autocomplete="off"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary btn-sm" @click="noteModal=false">取消</button>
        <button type="submit" class="btn btn-sm" :disabled="loading">保存</button>
      </div>
    </form>
  </div>
</template>
